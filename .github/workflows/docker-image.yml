# Builds, tests and deploys every image that the docker-compose file of the
# calling repository builds, for each architecture on a native runner, and
# publishes it on Docker Hub as one multi-platform image under all its tags.
#
# Every image repository of mwaeckerlin calls this one workflow, so the build
# and deploy rules live in one place. The caller is the short file
# `.github/workflows/docker.yml` described in the README of mwaeckerlin/scratch.
#
# The images are the compose services that have both `build` and `image`.
# A service whose build context lies in a git submodule is skipped: it belongs
# to the submodule's own repository, which publishes it itself.
#
# Tags. An image `repo:latest` is published as `latest`, `YYYYMMDD` (the day
# of the build, UTC), `<version>` and `<version>-YYYYMMDD`, the version taken
# from package.json; an image with an own tag `repo:inotify` as `inotify`,
# `inotify-YYYYMMDD`, `inotify-<version>` and `inotify-<version>-YYYYMMDD`. So a
# rebuild of the same version stays addressable by its date. A repository that
# builds several versions from branches names them in `branch-tags`: the first
# rule whose `branch` matches the branch name (a Python regular expression,
# matched in full) gives the suffix of every tag, e.g. branch `new-33` with
# the rule `new-([0-9]+)` → `-\1` builds `nginx-33`, `nginx-33-20260926`, …
#
# Per architecture: `docker compose build`, `npm test`, the labels of the
# sources, then `npm run deploy`
# with a compose override that names every image with an architecture tag
# (`latest-amd64`, `nginx-33-arm64`). Only when every architecture is green,
# the deploy job joins them into all tags of the image, from which docker
# pulls the variant that fits the host. Any failure stops the run before a
# published tag changes.
#
# A push, a manual start and a git tag release always build. A scheduled run,
# and a run the scheduled run starts on a version branch, first runs the job
# `check`, which builds only when a source of an image changed since the
# published image was built: the digest of a parent image named in `FROM` or
# `COPY --from`, a download named literally in `ADD` or in a `RUN` with wget or
# curl, or when the published image is older than `rebuild-days`, which
# covers the packages. Every build records its sources as labels in the
# image, which the next check reads.
#
# GitHub disables the scheduled workflows of a public repository after 60
# days without activity. Each scheduled run therefore enables its calling
# workflow through the API, with the `actions: write` the caller grants;
# whether that resets the 60 days, GitHub does not document.
#
# GitHub starts scheduled runs on the default branch only. With `branch-tags`,
# the scheduled run therefore starts the workflow `docker.yml` on every other
# branch that matches a rule, so the check reaches every version; the caller
# grants `actions: write` for that.
#
# A push of the branch `version-base` rebuilds every version too: once its
# deploy is green, the job `versions` runs the command `version-branches`,
# which regenerates the version branches from the pushed commit, and starts
# the workflow on every branch it moved, with `build=true`, so each major
# version publishes the version just pushed. The caller grants
# `contents: write` for the push of the branches.
#
# Needs in the calling repository: the secret DOCKERHUB_TOKEN, a Docker Hub
# access token with read and write. The Docker Hub user is the variable
# DOCKERHUB_USERNAME, or the GitHub owner of the repository if it is not set.

name: docker-image

on:
  workflow_call:
    inputs:
      architectures:
        description: JSON list of the architectures, each built on a native runner
        type: string
        default: '["amd64", "arm64"]'
      test:
        description: command that tests the built images before they are deployed; empty for none
        type: string
        default: npm test
      free-disk:
        description: remove the preinstalled SDKs and images of the runner before the build; measured 2026-09-26 on the 145GB root, free space went from 87 to 114GB on amd64 and from 108 to 123GB on arm64
        type: boolean
        default: false
      branch-tags:
        description: 'JSON list of {"branch" or "tag": <regex>, "suffix": <template>, "version": <prefix>}; the first rule matching the branch, or the git tag of `ref`, appends its suffix to every tag and puts its optional prefix before the version'
        type: string
        default: '[]'
      ref:
        description: git tag to build in place of the branch that started the run; empty for that branch
        type: string
        default: ''
      rebuild-days:
        description: a scheduled run builds an image whose sources are unchanged once it is this many days old, for the packages the check does not compare
        type: number
        default: 7
      version-base:
        description: the branch whose push regenerates the version branches with `version-branches`; empty for none
        type: string
        default: ''
      version-branches:
        description: 'command that regenerates and force-pushes the version branches from the commit in the environment variable BASE_COMMIT (`git checkout -B <branch> "$BASE_COMMIT"`); it runs after a green deploy of a push to `version-base`, and every branch it moved is then built with `-f build=true`, which the caller declares as a workflow_dispatch input; the caller grants `contents: write`'
        type: string
        default: ''
    secrets:
      DOCKERHUB_TOKEN:
        required: true

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.decide.outputs.build }}
      record: ${{ steps.decide.outputs.record }}
    steps:
      - &checkout
        uses: actions/checkout@v5
        with:
          # a test may build an image from a submodule; SSH submodule
          # addresses are fetched over HTTPS when no ssh-key is given
          submodules: recursive
          ref: ${{ inputs.ref }}
      - &select
        name: select the images and tags of this repository
        id: select
        shell: python3 {0}
        env:
          ARCH: ${{ matrix.arch }}
          REF_NAME: ${{ inputs.ref || github.ref_name }}
          RELEASE: ${{ inputs.ref }}
          BRANCH_TAGS: ${{ inputs.branch-tags }}
          # set by the tests only; a run uses the day it runs
          BUILD_DATE: ""
        run: |
          import datetime, json, os, re, subprocess, sys

          config = json.loads(subprocess.run(
              ['docker', 'compose', 'config', '--format', 'json'],
              check=True, capture_output=True, text=True).stdout)
          compose = next((f for f in ('compose.yaml', 'compose.yml', 'docker-compose.yaml', 'docker-compose.yml')
                          if os.path.exists(f)), None)
          submodules = []
          if os.path.exists('.gitmodules'):
              lines = subprocess.run(
                  ['git', 'config', '--file', '.gitmodules', '--get-regexp', r'\.path$'],
                  capture_output=True, text=True).stdout.splitlines()
              submodules = [line.split(' ', 1)[1] for line in lines]

          release = os.environ.get('RELEASE', '')
          kind = 'tag' if release else 'branch'
          suffix = prefix = ''
          for rule in json.loads(os.environ.get('BRANCH_TAGS') or '[]'):
              found = kind in rule and re.fullmatch(rule[kind], os.environ.get('REF_NAME', ''))
              if found:
                  suffix = found.expand(rule['suffix'])
                  prefix = rule.get('version', '')
                  break
          if release and not suffix:
              print(f'::error::no rule of branch-tags names the git tag {release}')
              sys.exit(1)
          date = os.environ.get('BUILD_DATE') or datetime.datetime.now(datetime.timezone.utc).strftime('%Y%m%d')
          version = None
          if not release and os.path.exists('package.json'):
              version = json.load(open('package.json')).get('version')
          if version:
              version = prefix + version

          def tags(tag):
              """Every tag an image `repo:<tag>` is published under."""
              base = tag + suffix if tag != 'latest' else (suffix.lstrip('-') or 'latest')
              result = [base, date if base == 'latest' else f'{base}-{date}']
              if version:
                  named = version if base == 'latest' else f'{base}-{version}'
                  result += [named, f'{named}-{date}']
              return base, result

          root = os.getcwd()
          services, stage, publish, override = [], [], [], {}
          for name, service in sorted(config.get('services', {}).items()):
              if 'build' not in service:
                  continue
              if not service.get('image'):
                  print(f'skipped {name}: no image name, so it cannot be pushed')
                  continue
              context = os.path.relpath(service['build'].get('context', root), root)
              owner = next((s for s in submodules if context == s or context.startswith(s + '/')), None)
              if owner:
                  print(f'skipped {name}: built in submodule {owner}, which publishes it')
                  continue
              image = service['image']
              if ':' not in image.rsplit('/', 1)[-1]:
                  image += ':latest'
              repository, tag = image.rsplit(':', 1)
              base, all_tags = tags(tag)
              staging = f'{repository}:{base}'
              services.append(name)
              override[name] = {'image': f"{staging}-{os.environ['ARCH']}"}
              if [image, staging] not in stage:
                  stage.append([image, staging])
                  publish.append({'source': staging, 'tags': [f'{repository}:{t}' for t in all_tags]})
          if not stage:
              print('::error::the compose file builds no image of this repository')
              sys.exit(1)
          # the override gives every image its architecture tag, so that
          # `npm run deploy` pushes the tested image without touching a
          # published tag
          override_file = os.path.join(os.environ['RUNNER_TEMP'], 'docker-compose.deploy.yml')
          with open(override_file, 'w') as out:
              json.dump({'services': override}, out, indent=2)
          print('services:', *services)
          for entry in publish:
              print('publish', entry['source'], 'as', *entry['tags'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"services={' '.join(services)}\n")
              output.write(f"stage={json.dumps(stage)}\n")
              output.write(f"publish={json.dumps(publish)}\n")
              output.write(f"compose-files={compose}:{override_file}\n")
      - name: keep the scheduled workflow enabled
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          workflow="${WORKFLOW_REF%@*}"
          workflow="${workflow##*/}"
          gh api -X PUT "repos/$REPOSITORY/actions/workflows/$workflow/enable" \
            || echo "::warning::$workflow cannot be enabled through the API; the caller grants actions: write for that"
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: decide whether a source of the images changed
        id: decide
        shell: python3 {0}
        env:
          SERVICES: ${{ steps.select.outputs.services }}
          PUBLISH: ${{ steps.select.outputs.publish }}
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          # set by the job versions when it starts a version branch after a
          # push of its base branch
          FORCE: ${{ github.event.inputs.build }}
          REBUILD_DAYS: ${{ inputs.rebuild-days }}
          # set by the tests only; a run compares with the moment it runs
          NOW: ""
        run: |
          import datetime, hashlib, json, os, re, subprocess, sys, urllib.error, urllib.parse, urllib.request

          PARENTS, DOWNLOADS, BUILT = 'org.mwaeckerlin.parents', 'org.mwaeckerlin.downloads', 'org.mwaeckerlin.built'
          VARIABLE = re.compile(r'\$\{(\w+)(?::-([^}]*))?\}|\$(\w+)')
          URL = re.compile(r'https?://[^\s\'"`;|&()<>]+')


          def expand(value, scope):
              def replace(match):
                  name = match.group(1) or match.group(3)
                  if scope.get(name):
                      return scope[name]
                  return match.group(2) if match.group(2) is not None else match.group(0)
              return VARIABLE.sub(replace, value)


          def normalize(reference):
              name = reference.split('@', 1)[0]
              return reference if '@' in reference or ':' in name.rsplit('/', 1)[-1] else reference + ':latest'


          def instructions(text):
              """Every instruction of a Dockerfile as (keyword, arguments), continuation lines joined."""
              current = ''
              for line in text.splitlines():
                  line = line.strip()
                  if not line or line.startswith('#'):
                      continue
                  if line.endswith('\\'):
                      current += line[:-1] + ' '
                      continue
                  words = (current + line).split(None, 1)
                  current = ''
                  yield words[0].upper(), words[1] if len(words) > 1 else ''
              if current.strip():
                  words = current.split(None, 1)
                  yield words[0].upper(), words[1] if len(words) > 1 else ''


          def manifest(reference):
              """The raw manifest a registry serves for the reference, None where it has none."""
              run = subprocess.run(['docker', 'buildx', 'imagetools', 'inspect', reference, '--raw'], capture_output=True)
              if run.returncode == 0:
                  return run.stdout
              error = run.stderr.decode(errors='replace').strip()
              if 'not found' in error.lower():
                  return None
              print(f'::error::{reference} cannot be looked up: {error}')
              sys.exit(1)


          class Unfollowed(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None


          opener = urllib.request.build_opener(Unfollowed)


          GIT = re.compile(r'(https?://[^#]+\.git)(?:#([^:]*))?(?::.*)?')


          def commit_of(url, repository, ref):
              """The commit a git reference names; the page of a repository changes its ETag on every request."""
              ref = ref or 'HEAD'
              if re.fullmatch(r'[0-9a-f]{40}', ref):
                  return 'commit ' + ref
              if ref.startswith('-'):
                  print(f'{url}: {ref} is no git reference')
                  return None
              try:
                  run = subprocess.run(['git', 'ls-remote', repository, ref], capture_output=True, text=True, timeout=60)
              except subprocess.TimeoutExpired:
                  print(f'{url}: no answer from git ls-remote')
                  return None
              if run.returncode:
                  print(f'{url}: no answer, {run.stderr.strip()}')
                  return None
              found = dict(reversed(line.split('\t', 1)) for line in run.stdout.splitlines() if '\t' in line)
              for name in (f'refs/heads/{ref}', f'refs/tags/{ref}^{{}}', f'refs/tags/{ref}', ref):
                  if name in found:
                      return 'commit ' + found[name]
              print(f'{url}: the repository has no reference {ref}')
              return None


          def identify(url):
              """What tells this version of the download from the next, None where the server says nothing."""
              git = GIT.fullmatch(url)
              if git:
                  return commit_of(url, git.group(1), git.group(2))
              address = url
              for _ in range(10):
                  try:
                      response = opener.open(urllib.request.Request(address, method='HEAD'), timeout=30)
                      status, headers = response.status, response.headers
                  except urllib.error.HTTPError as error:
                      status, headers = error.code, error.headers
                  except (urllib.error.URLError, OSError) as error:
                      print(f'{url}: no answer, {error}')
                      return None
                  if 300 <= status < 400 and headers.get('Location'):
                      target = urllib.parse.urljoin(address, headers['Location'])
                      if '/releases/latest' in urllib.parse.urlsplit(address).path:
                          return 'release ' + target
                      address = target
                      continue
                  if status >= 400:
                      print(f'{url}: answers {status}')
                      return None
                  return headers.get('ETag') or headers.get('Last-Modified')
              return None


          services = json.loads(subprocess.run(['docker', 'compose', 'config', '--format', 'json'],
                                               check=True, capture_output=True, text=True).stdout).get('services', {})
          own = {normalize(s['image']) for s in services.values() if 'build' in s and s.get('image')}
          parents, downloads = set(), set()
          for name in os.environ['SERVICES'].split():
              build = services[name]['build']
              if 'dockerfile_inline' in build:
                  path, text = f'{name} (inline)', build['dockerfile_inline']
              else:
                  path = os.path.join(build.get('context', '.'), build.get('dockerfile', 'Dockerfile'))
                  text = open(path).read()
              args = {k: v for k, v in (build.get('args') or {}).items() if v is not None}
              scope, stages, started = dict(args), set(), False
              for keyword, arguments in instructions(text):
                  references, stage = [], None
                  if keyword == 'ARG' and not started:
                      for definition in arguments.split():
                          key, given, default = definition.partition('=')
                          if given and key not in args:
                              scope[key] = default.strip('"\'')
                  elif keyword == 'FROM':
                      started = True
                      words = [w for w in arguments.split() if not w.startswith('--')]
                      references = [expand(words[0], scope)]
                      if len(words) == 3 and words[1].lower() == 'as':
                          stage = words[2].lower()
                  elif keyword in ('COPY', 'ADD'):
                      references = [expand(w[len('--from='):], scope) for w in arguments.split() if w.startswith('--from=')]
                  for reference in references:
                      if reference.lower() in stages or reference == 'scratch' or reference.isdigit():
                          continue
                      if '$' in reference:
                          print(f'{path}: {reference} cannot be read from the Dockerfile')
                      elif normalize(reference) not in own:
                          parents.add(normalize(reference))
                  if stage:
                      stages.add(stage)
                  if keyword == 'ADD' or (keyword == 'RUN' and re.search(r'\b(wget|curl)\b', arguments)):
                      for url in URL.findall(arguments):
                          if '$' in url:
                              print(f'{path}: {url} is assembled in shell code, the build after {os.environ.get("REBUILD_DAYS") or 7} days covers it')
                          else:
                              downloads.add(url)

          current = {PARENTS: {}, DOWNLOADS: {}}
          for parent in sorted(parents):
              raw = manifest(parent)
              if raw is None:
                  print(f'::error::the parent image {parent} is not published')
                  sys.exit(1)
              current[PARENTS][parent] = 'sha256:' + hashlib.sha256(raw).hexdigest()
          for url in sorted(downloads):
              identifier = identify(url)
              if identifier:
                  current[DOWNLOADS][url] = identifier
          for kind in (PARENTS, DOWNLOADS):
              for source, value in current[kind].items():
                  print(f'{source}: {value}')

          def image_config(published):
              """The image configuration of the published image, of its first platform where it has several."""
              raw = manifest(published)
              if raw is None:
                  return None
              reference = published
              entries = [m for m in json.loads(raw).get('manifests', [])
                         if m.get('platform', {}).get('architecture') not in (None, 'unknown')]
              if entries:
                  reference = published.rsplit(':', 1)[0] + '@' + entries[0]['digest']
              run = subprocess.run(['docker', 'buildx', 'imagetools', 'inspect', reference, '--format', '{{json .Image}}'],
                                   capture_output=True, text=True)
              if run.returncode:
                  print(f'::error::{reference} cannot be looked up: {run.stderr.strip()}')
                  sys.exit(1)
              return json.loads(run.stdout)


          event, actor = os.environ['EVENT'], os.environ.get('ACTOR', '')
          reasons = []
          if os.environ.get('FORCE') == 'true':
              reasons.append(f'a {event} run with build=true always builds')
          elif not (event == 'schedule' or (event == 'workflow_dispatch' and actor == 'github-actions[bot]')):
              reasons.append(f'a {event} run always builds')
          else:
              days = float(os.environ.get('REBUILD_DAYS') or 7)
              now = (datetime.datetime.fromisoformat(os.environ['NOW']) if os.environ.get('NOW')
                     else datetime.datetime.now(datetime.timezone.utc))
              for entry in json.loads(os.environ['PUBLISH']):
                  published = entry['tags'][0]
                  image = image_config(published)
                  if image is None:
                      reasons.append(f'{published} is not published yet')
                      continue
                  labels = (image.get('config') or {}).get('Labels') or {}
                  print(f'{published} carries the labels: {", ".join(sorted(labels)) or "none"}')
                  if PARENTS not in labels:
                      reasons.append(f'{published} carries no record of its sources')
                      continue
                  stamp = re.match(r'([0-9-]+T[0-9:]+)(?:\.[0-9]+)?(Z|[+-][0-9:]+)?', labels.get(BUILT) or image['created'])
                  zone = stamp.group(2) if stamp.group(2) not in (None, 'Z') else '+00:00'
                  age = now - datetime.datetime.fromisoformat(stamp.group(1) + zone)
                  if age >= datetime.timedelta(days=days):
                      reasons.append(f'{published} was built {age.days} days ago, the limit is {days:g} days')
                  for kind in (PARENTS, DOWNLOADS):
                      recorded = json.loads(labels.get(kind) or '{}')
                      for source, value in current[kind].items():
                          if recorded.get(source) != value:
                              reasons.append(f'{source} changed since {published} was built: {recorded.get(source)} → {value}')
          for reason in reasons:
              print('build:', reason)
          if not reasons:
              print('no build: every parent image and download is unchanged; the packages are not compared,'
                    f' the build after {os.environ.get("REBUILD_DAYS") or 7} days covers them')
          record = {kind: json.dumps(values, separators=(',', ':')) for kind, values in current.items()}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"build={'true' if reasons else 'false'}\n")
              output.write(f"record={json.dumps(record, separators=(',', ':'))}\n")

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    strategy:
      matrix:
        arch: ${{ fromJSON(inputs.architectures) }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    outputs:
      publish: ${{ steps.select.outputs.publish }}
    steps:
      - *checkout
      - *select
      - name: free disk space
        if: inputs.free-disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift
          docker system prune --all --force
          df -h /
      - name: build
        run: docker compose build ${{ steps.select.outputs.services }}
      - name: install the development dependencies
        if: inputs.test != '' && hashFiles('package-lock.json') != ''
        run: npm ci
      - name: test
        if: inputs.test != ''
        env:
          TEST: ${{ inputs.test }}
        run: bash -c "$TEST"
      - name: label the images with the sources they are built from
        shell: python3 {0}
        env:
          RECORD: ${{ needs.check.outputs.record }}
          STAGE: ${{ steps.select.outputs.stage }}
        run: |
          # after the test, which may have built the images once more through
          # a compose file of its own: the labels go onto exactly the images
          # that are pushed, as a configuration on top of their tested layers;
          # the build time is a label too, because such a build keeps the
          # creation time of a layer the cache already held
          import datetime, json, os, subprocess
          record = json.loads(os.environ.get('RECORD') or '{}')
          if record:
              record['org.mwaeckerlin.built'] = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          labels = [a for k, v in record.items() for a in ('--label', f'{k}={v}')]
          for image, _ in json.loads(os.environ['STAGE']) if labels else []:
              subprocess.run(['docker', 'buildx', 'build', '--builder', 'default', '--quiet', *labels, '--tag', image, '-'],
                             input=f'FROM {image}\n', text=True, check=True, stdout=subprocess.DEVNULL)
              print('labels', *(a.split('=', 1)[0] for a in labels[1::2]), 'on', image)
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: deploy under the architecture tag
        env:
          STAGE: ${{ steps.select.outputs.stage }}
          SERVICES: ${{ steps.select.outputs.services }}
          ARCH: ${{ matrix.arch }}
          COMPOSE_FILE: ${{ steps.select.outputs.compose-files }}
          COMPOSE_PATH_SEPARATOR: ":"
        run: |
          for pair in $(echo "$STAGE" | jq -r '.[] | .[0] + "=" + .[1]'); do
            docker tag "${pair%%=*}" "${pair#*=}-$ARCH"
          done
          if jq -e '.scripts.deploy' package.json > /dev/null 2>&1; then
            npm run deploy
          else
            docker compose push $SERVICES
          fi
      - name: prove that the pushed images carry the labels of their sources
        shell: python3 {0}
        env:
          RECORD: ${{ needs.check.outputs.record }}
          STAGE: ${{ steps.select.outputs.stage }}
          ARCH: ${{ matrix.arch }}
        run: |
          # read back from the registry, so that a build after the labelling,
          # by the test or by the deploy script, fails this run instead of
          # making every following check build again
          import json, os, subprocess, sys
          record = json.loads(os.environ.get('RECORD') or '{}')
          for _, staging in json.loads(os.environ['STAGE']) if record else []:
              pushed = f"{staging}-{os.environ['ARCH']}"
              run = subprocess.run(['docker', 'buildx', 'imagetools', 'inspect', pushed, '--format', '{{json .Image}}'],
                                   capture_output=True, text=True)
              if run.returncode:
                  print(f'::error::{pushed} cannot be read back: {run.stderr.strip()}')
                  sys.exit(1)
              image = json.loads(run.stdout)
              if 'created' not in image:
                  image = image.get(f"linux/{os.environ['ARCH']}") or next(iter(image.values()))
              labels = (image.get('config') or {}).get('Labels') or {}
              missing = sorted(k for k, v in record.items() if labels.get(k) != v)
              if missing or 'org.mwaeckerlin.built' not in labels:
                  print(f'::error::{pushed} was pushed without the labels {", ".join(missing) or "org.mwaeckerlin.built"};'
                        ' a build after the step that labels the images replaced them')
                  sys.exit(1)
              print(pushed, 'carries the labels of its sources')

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: keep the image that is replaced under the day it was built
        shell: python3 {0}
        env:
          PUBLISH: ${{ needs.build.outputs.publish }}
        run: |
          import json, os, subprocess

          def inspect(name):
              run = subprocess.run(['docker', 'buildx', 'imagetools', 'inspect', name, '--format', '{{json .Image}}'],
                                   capture_output=True, text=True)
              return json.loads(run.stdout) if run.returncode == 0 and run.stdout.strip() else None

          for entry in json.loads(os.environ['PUBLISH']):
              current = entry['tags'][0]
              image = inspect(current)
              if not image:
                  continue
              config = image if 'created' in image else next(iter(image.values()))
              day = config['created'][:10].replace('-', '')
              repository, tag = current.rsplit(':', 1)
              dated = f'{repository}:{day}' if tag == 'latest' else f'{current}-{day}'
              if dated in entry['tags'] or inspect(dated):
                  continue
              print('keep', current, 'as', dated)
              subprocess.run(['docker', 'buildx', 'imagetools', 'create', '-t', dated, current], check=True)
      - name: join the architectures into all tags
        env:
          PUBLISH: ${{ needs.build.outputs.publish }}
          ARCHITECTURES: ${{ join(fromJSON(inputs.architectures), ' ') }}
        run: |
          echo "$PUBLISH" | jq -c '.[]' | while read -r entry; do
            source=$(echo "$entry" | jq -r '.source')
            targets=$(echo "$entry" | jq -r '.tags[] | "-t " + .')
            sources=""
            for arch in $ARCHITECTURES; do
              sources="$sources $source-$arch"
            done
            docker buildx imagetools create $targets $sources
          done

  versions:
    # a push of the base branch rebuilds every version branch from that very
    # commit, so each major version publishes the version just pushed; a push
    # with the GITHUB_TOKEN starts no workflow, so the job starts each branch
    # itself, with build=true past the check of unchanged sources
    needs: deploy
    if: github.event_name == 'push' && inputs.version-branches != '' && github.ref_name == inputs.version-base
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: regenerate the version branches from the pushed commit and build them
        shell: python3 {0}
        env:
          BRANCH_TAGS: ${{ inputs.branch-tags }}
          REF_NAME: ${{ github.ref_name }}
          BASE_COMMIT: ${{ github.sha }}
          SCRIPT: ${{ inputs.version-branches }}
          GH_TOKEN: ${{ github.token }}
        run: |
          import json, os, re, subprocess

          def heads():
              listing = subprocess.run(['git', 'ls-remote', '--heads', 'origin'], check=True,
                                       capture_output=True, text=True).stdout.split()
              return dict((listing[i + 1].removeprefix('refs/heads/'), listing[i]) for i in range(0, len(listing) - 1, 2))

          rules = json.loads(os.environ.get('BRANCH_TAGS') or '[]')
          before = heads()
          for key, value in (('user.name', 'github-actions[bot]'),
                             ('user.email', '41898282+github-actions[bot]@users.noreply.github.com')):
              subprocess.run(['git', 'config', key, value], check=True)
          subprocess.run(['bash', '-e', '-c', os.environ['SCRIPT']], check=True)
          after = heads()
          for branch in sorted(after):
              moved = before.get(branch) != after[branch]
              if moved and branch != os.environ['REF_NAME'] and any('branch' in r and re.fullmatch(r['branch'], branch) for r in rules):
                  print('build', branch, 'at', after[branch])
                  subprocess.run(['gh', 'workflow', 'run', 'docker.yml', '--ref', branch, '-f', 'build=true'], check=True)

  branches:
    # scheduled runs start on the default branch only; this one starts the
    # workflow on every other branch a rule of `branch-tags` names. It needs
    # `actions: write`, which the caller grants: a `permissions` block here
    # would be checked at start in every repository, also where this job
    # never runs, and end every run of a read-only repository in
    # startup_failure.
    if: github.event_name == 'schedule' && inputs.branch-tags != '[]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: start the scheduled run on every version branch
        shell: python3 {0}
        env:
          BRANCH_TAGS: ${{ inputs.branch-tags }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          import json, os, re, subprocess
          rules = json.loads(os.environ['BRANCH_TAGS'])
          heads = subprocess.run(['git', 'ls-remote', '--heads', 'origin'], check=True,
                                 capture_output=True, text=True).stdout.split()
          branches = [ref.removeprefix('refs/heads/') for ref in heads if ref.startswith('refs/heads/')]
          for branch in sorted(branches):
              if branch != os.environ['REF_NAME'] and any('branch' in r and re.fullmatch(r['branch'], branch) for r in rules):
                  print('rebuild', branch)
                  subprocess.run(['gh', 'workflow', 'run', 'docker.yml', '--ref', branch], check=True)
          if any('tag' in r for r in rules):
              refs = subprocess.run(['git', 'ls-remote', '--tags', 'origin'], check=True,
                                    capture_output=True, text=True).stdout.split()
              tags = {ref.removeprefix('refs/tags/') for ref in refs
                      if ref.startswith('refs/tags/') and not ref.endswith('^{}')}
              for tag in sorted(tags):
                  if any('tag' in r and re.fullmatch(r['tag'], tag) for r in rules):
                      print('rebuild', tag)
                      subprocess.run(['gh', 'workflow', 'run', 'docker.yml', '--ref', os.environ['REF_NAME'],
                                      '-f', f'ref={tag}'], check=True)
